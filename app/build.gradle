plugins {
    id 'com.android.application'
}

android {
    namespace 'com.leba.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.leba.app'
        minSdk 24
        targetSdk 34
        versionCode System.getenv('VERSION_CODE')?.toInteger() ?: 99
        versionName "v" + (System.getenv('VERSION_CODE') ?: "99")
    }

    // 🔴 v54: mp4 必须 noCompress！否则 getAssets().openFd() 会抛
    //   "compressed" 异常 → 手动拦截失败 → 内置视频加载不了
    aaptOptions {
        noCompress "mp4"
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('KEYSTORE_PATH') ?: "${rootProject.rootDir}/keystore.jks")
            storePassword System.getenv('KEYSTORE_PASSWORD') ?: 'leba123'
            keyAlias System.getenv('KEY_ALIAS') ?: 'leba'
            keyPassword System.getenv('KEY_PASSWORD') ?: 'leba123'
            enableV1Signing true
            enableV2Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.8.0'
}
